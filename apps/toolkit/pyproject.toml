[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-lab-toolkit"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["toolkit-core", "mcp==2.3.0", "tomlkit>=0.13,<1"]

[project.optional-dependencies]
mod-engine = ["eu5-mod-engine"]
election-model = ["election-model"]

[project.scripts]
lab = "personal_lab.cli:main"

[tool.uv.sources]
toolkit-core = { workspace = true }
eu5-mod-engine = { workspace = true }
election-model = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
