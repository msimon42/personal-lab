name: Headless application contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.6'
      - run: uv sync --locked --all-packages --extra dev
      - run: uv run --extra dev python scripts/check.py
      - run: uv build --all-packages
      - run: uv run python scripts/package.py
