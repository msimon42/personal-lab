[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eu5-mod-engine"
version = "0.1.0"
description = "Evidence-scoped EU5 and CK3 libraries for headless personal tools"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8,<3",
  "jsonschema>=4.23,<5",
  "toolkit-core",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.9,<1", "build>=1,<2", "setuptools>=75", "installer>=0.7,<1", "mypy>=1.15,<2", "personal-lab-toolkit[mod-engine,election-model]"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.agent" = ["data/*.json"]

[tool.setuptools.data-files]
"share/mod-engine/skills/ck3-mod-agent" = ["skills/ck3-mod-agent/SKILL.md"]
"share/mod-engine/skills/ck3-mod-agent/agents" = ["skills/ck3-mod-agent/agents/openai.yaml"]
"share/mod-engine/skills/ck3-mod-agent/references" = ["skills/ck3-mod-agent/references/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages/toolkit_core/src", "apps/toolkit/src", "packages/election_model/src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv.workspace]
members = ["apps/toolkit", "packages/toolkit_core", "packages/election_model"]

[tool.uv.sources]
toolkit-core = { workspace = true }
personal-lab-toolkit = { workspace = true }
election-model = { workspace = true }

[tool.mypy]
python_version = "3.12"
follow_imports = "silent"
files = ["packages/toolkit_core/src/toolkit_core/contracts.py", "apps/toolkit/src/personal_lab/profiles.py", "apps/toolkit/src/personal_lab/toolsets/ck3_models.py", "packages/election_model/src/election_model"]
