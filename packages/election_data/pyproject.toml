[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "election-data"
version = "0.1.0"
description = "Auditable local archive, normalization and releases of observed US election results"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3"]

[project.scripts]
election-data = "election_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
election_data = ["migrations/*.sql", "manifests/*.json"]
